name: GitHub Repository Replica

on:
  workflow_dispatch:
    inputs:
      source_repo_url:
        description: "Source Repository URL"
        required: true
        type: string

      target_repo_name:
        description: "Target Repository Name"
        required: true
        type: string

jobs:
  clone-repository:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify GitHub CLI
        run: |
          gh --version

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Authenticate GitHub
        run: |
          gh auth status

      - name: Get Authenticated User
        id: github_user
        run: |
          USERNAME=$(gh api user --jq '.login')
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "Authenticated User: $USERNAME"

      - name: Create Target Repository
        run: |
          OWNER="${{ steps.github_user.outputs.username }}"
          REPO="${{ github.event.inputs.target_repo_name }}"

          if gh repo view "$OWNER/$REPO" >/dev/null 2>&1; then
            echo "Repository already exists"
          else
            gh repo create "$OWNER/$REPO" --private
            echo "Repository created"
          fi

      - name: Mirror Clone Source Repository
        run: |
          git clone --mirror \
            "${{ github.event.inputs.source_repo_url }}" \
            repo.git

      - name: Push Repository Mirror
        run: |
          cd repo.git

          TARGET_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ steps.github_user.outputs.username }}/${{ github.event.inputs.target_repo_name }}.git"

          git remote set-url origin "$TARGET_URL"

          git push --mirror

      - name: Verify Repository
        run: |
          echo "====================================="
          echo "Repository Clone Completed"
          echo "====================================="
          echo "Source Repository:"
          echo "${{ github.event.inputs.source_repo_url }}"
          echo ""
          echo "Target Repository:"
          echo "https://github.com/${{ steps.github_user.outputs.username }}/${{ github.event.inputs.target_repo_name }}"

      - name: Display Repository URL
        run: |
          gh repo view \
            "${{ steps.github_user.outputs.username }}/${{ github.event.inputs.target_repo_name }}" \
            --json url,name,visibility

      - name: List Branches
        run: |
          gh api repos/${{ steps.github_user.outputs.username }}/${{ github.event.inputs.target_repo_name }}/branches \
            --jq '.[].name'

      - name: Success
        run: |
          echo "✅ Repository replication completed successfully."
          echo "✅ All branches copied."
          echo "✅ All tags copied."
          echo "✅ Repository contents copied."
