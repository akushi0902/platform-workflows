name: Full Repository Clone - Files, Branches, Rules & Branch Protection

permissions:
  contents: write
  administration: write
  actions: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      new_repo_name:
        description: 'New Repository Name'
        required: true
        type: string

      source_repo_url:
        description: 'Source Repository URL'
        required: true
        type: string

      visibility:
        description: 'Repository Visibility'
        required: false
        default: 'private'
        type: choice
        options:
          - private
          - public

      team_slug:
        description: 'Team Slug (optional - for CODEOWNERS)'
        required: false
        type: string

      copy_branch_protection:
        description: 'Copy Branch Protection Rules'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

      copy_rulesets:
        description: 'Copy Repository Rulesets'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  clone-repo:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      ORG: akushi0902

    steps:

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate Inputs
        run: |
          if [ -z "${{ inputs.new_repo_name }}" ]; then
            echo "❌ new_repo_name is required!"
            exit 1
          fi

          if [ -z "${{ inputs.source_repo_url }}" ]; then
            echo "❌ source_repo_url is required!"
            exit 1
          fi

          echo "✅ Inputs validated"

      - name: Create New Repository
        run: |
          echo "📦 Creating repo..."

          gh repo create "${{ inputs.new_repo_name }}" \
            --${{ inputs.visibility }}

          echo "✅ Repository created"

      - name: Verify Repository Exists
        run: |
          echo "🔍 Verifying repository..."

          sleep 5

          gh repo view "$ORG/${{ inputs.new_repo_name }}" \
            || exit 1

          echo "✅ Repository confirmed"

      - name: Mirror Clone Source Repository
        run: |
          echo "🔄 Cloning source repository..."

          SOURCE_PATH=$(echo "${{ inputs.source_repo_url }}" | sed 's#https://github.com/##')

          git clone --mirror \
            https://x-access-token:${{ secrets.GH_PAT }}@github.com/${SOURCE_PATH} \
            repo-mirror

          echo "✅ Mirror clone complete"

      - name: Push Mirror To Destination Repository
        run: |
          echo "🚀 Pushing repository..."

          cd repo-mirror

          git remote set-url origin \
            https://x-access-token:${{ secrets.GH_PAT }}@github.com/$ORG/${{ inputs.new_repo_name }}.git

          git push --mirror

          echo "✅ Mirror push complete"

      - name: Copy Branch Protection Rules
        if: ${{ inputs.copy_branch_protection == 'true' }}
        run: |
          echo "🔒 Copying branch protection rules..."

          SOURCE_OWNER=$(echo "${{ inputs.source_repo_url }}" \
            | sed 's#https://github.com/##' \
            | cut -d'/' -f1)

          SOURCE_REPO=$(echo "${{ inputs.source_repo_url }}" \
            | sed 's#https://github.com/##' \
            | cut -d'/' -f2 \
            | sed 's/.git//')

          BRANCHES=$(gh api repos/$SOURCE_OWNER/$SOURCE_REPO/branches --jq '.[].name')

          for BRANCH in $BRANCHES
          do
            echo "Processing $BRANCH"

            gh api \
            repos/$SOURCE_OWNER/$SOURCE_REPO/branches/$BRANCH/protection \
            > protection.json 2>/dev/null || continue

            jq '
            {
              required_status_checks:
              (
                if .required_status_checks == null
                then null
                else {
                  strict: .required_status_checks.strict,
                  checks: (.required_status_checks.checks // [])
                }
                end
              ),

              enforce_admins:
                (.enforce_admins.enabled // false),

              required_pull_request_reviews:
              (
                if .required_pull_request_reviews == null
                then null
                else {
                  dismiss_stale_reviews:
                  .required_pull_request_reviews.dismiss_stale_reviews,

                  require_code_owner_reviews:
                  .required_pull_request_reviews.require_code_owner_reviews,

                  required_approving_review_count:
                  .required_pull_request_reviews.required_approving_review_count
                }
                end
              ),

              restrictions: null,

              required_linear_history:
                (.required_linear_history.enabled // false),

              allow_force_pushes:
                (.allow_force_pushes.enabled // false),

              allow_deletions:
                (.allow_deletions.enabled // false),

              block_creations:
                (.block_creations.enabled // false),

              required_conversation_resolution:
                (.required_conversation_resolution.enabled // false)
            }
            ' protection.json > clean-protection.json

            gh api \
              --method PUT \
              repos/$ORG/${{ inputs.new_repo_name }}/branches/$BRANCH/protection \
              --input clean-protection.json \
              || echo "⚠️ Protection copy failed for $BRANCH"
          done

          echo "✅ Branch protections copied"

      - name: Copy Repository Rulesets
        if: ${{ inputs.copy_rulesets == 'true' }}
        run: |
          echo "📋 Copying rulesets..."

          SOURCE_OWNER=$(echo "${{ inputs.source_repo_url }}" \
            | sed 's#https://github.com/##' \
            | cut -d'/' -f1)

          SOURCE_REPO=$(echo "${{ inputs.source_repo_url }}" \
            | sed 's#https://github.com/##' \
            | cut -d'/' -f2 \
            | sed 's/.git//')

          gh api \
            repos/$SOURCE_OWNER/$SOURCE_REPO/rulesets \
            > rulesets.json

          jq -c '.[]' rulesets.json | while read RULESET
          do

            echo "$RULESET" | jq '
            del(
              .id,
              .node_id,
              .source,
              .source_type,
              .url,
              ._links,
              .created_at,
              .updated_at
            )
            ' > clean-ruleset.json

            gh api \
              --method POST \
              repos/$ORG/${{ inputs.new_repo_name }}/rulesets \
              --input clean-ruleset.json \
              || echo "⚠️ Ruleset copy failed"
          done

          echo "✅ Rulesets copied"

      - name: Setup CODEOWNERS
        if: ${{ inputs.team_slug != '' }}
        run: |
          echo "👥 Creating CODEOWNERS..."

          git clone \
            https://x-access-token:${{ secrets.GH_PAT }}@github.com/$ORG/${{ inputs.new_repo_name }}.git \
            codeowners-repo

          cd codeowners-repo

          mkdir -p .github

          echo "* @$ORG/${{ inputs.team_slug }}" > .github/CODEOWNERS

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          git add .github/CODEOWNERS

          git commit -m "chore: add CODEOWNERS file" || true

          git push

          echo "✅ CODEOWNERS created"

      - name: Summary
        run: |
          echo "🎉 Repository clone complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "Source Repository:"
          echo "${{ inputs.source_repo_url }}"

          echo "Destination Repository:"
          echo "https://github.com/$ORG/${{ inputs.new_repo_name }}"

          echo "Visibility:"
          echo "${{ inputs.visibility }}"

          echo "Branch Protection:"
          echo "${{ inputs.copy_branch_protection }}"

          echo "Rulesets:"
          echo "${{ inputs.copy_rulesets }}"

          echo "CODEOWNERS Team:"
          echo "${{ inputs.team_slug }}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
