name: Full Repository Clone - Files, Branches, Rules & Branch Protection

permissions:
  contents: write
  actions: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      new_repo_name:
        description: 'New Repository Name'
        required: true
        type: string

      source_repo_url:
        description: 'Source Repository URL'
        required: true
        type: string

      visibility:
        description: 'Repository Visibility'
        required: false
        default: 'private'
        type: choice
        options:
          - private
          - public

      target_owner:
        description: 'Target GitHub owner/org/user'
        required: false
        default: 'akushi0902'
        type: string

      team_slug:
        description: 'Team Slug optional - only for org repos CODEOWNERS'
        required: false
        type: string

      copy_branch_protection:
        description: 'Copy Classic Branch Protection Rules'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

      copy_rulesets:
        description: 'Copy Repository Rulesets'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  clone-repo:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}

    steps:
      - name: Install Dependencies
        run: |
          echo "Installing dependencies..."
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate Inputs
        run: |
          if [ -z "${{ inputs.new_repo_name }}" ]; then
            echo "ERROR: new_repo_name is required"
            exit 1
          fi

          if [ -z "${{ inputs.source_repo_url }}" ]; then
            echo "ERROR: source_repo_url is required"
            exit 1
          fi

          if [ -z "${{ inputs.target_owner }}" ]; then
            echo "ERROR: target_owner is required"
            exit 1
          fi

          echo "Inputs validated"

      - name: Prepare Repository Variables
        run: |
          SOURCE_URL="${{ inputs.source_repo_url }}"
          SOURCE_URL="${SOURCE_URL%.git}"
          SOURCE_URL="${SOURCE_URL%/}"

          if echo "$SOURCE_URL" | grep -q "https://github.com/"; then
            SOURCE_PATH="${SOURCE_URL#https://github.com/}"
          else
            echo "ERROR: source_repo_url must be like https://github.com/owner/repo"
            exit 1
          fi

          SOURCE_OWNER="$(echo "$SOURCE_PATH" | cut -d '/' -f1)"
          SOURCE_REPO="$(echo "$SOURCE_PATH" | cut -d '/' -f2)"
          TARGET_OWNER="${{ inputs.target_owner }}"
          TARGET_REPO="${{ inputs.new_repo_name }}"

          if [ -z "$SOURCE_OWNER" ] || [ -z "$SOURCE_REPO" ]; then
            echo "ERROR: Could not parse source owner/repo"
            exit 1
          fi

          echo "SOURCE_URL=$SOURCE_URL" >> "$GITHUB_ENV"
          echo "SOURCE_OWNER=$SOURCE_OWNER" >> "$GITHUB_ENV"
          echo "SOURCE_REPO=$SOURCE_REPO" >> "$GITHUB_ENV"
          echo "TARGET_OWNER=$TARGET_OWNER" >> "$GITHUB_ENV"
          echo "TARGET_REPO=$TARGET_REPO" >> "$GITHUB_ENV"

          echo "Source owner: $SOURCE_OWNER"
          echo "Source repo: $SOURCE_REPO"
          echo "Target owner: $TARGET_OWNER"
          echo "Target repo: $TARGET_REPO"

      - name: Detect Target Owner Type
        run: |
          echo "Detecting target owner type..."

          TARGET_OWNER_TYPE=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "users/$TARGET_OWNER" \
            --jq '.type')

          if [ "$TARGET_OWNER_TYPE" = "Organization" ]; then
            echo "Target owner is an Organization"
            echo "TARGET_OWNER_TYPE=Organization" >> "$GITHUB_ENV"
          elif [ "$TARGET_OWNER_TYPE" = "User" ]; then
            echo "Target owner is a Personal User"
            echo "TARGET_OWNER_TYPE=User" >> "$GITHUB_ENV"
          else
            echo "ERROR: Unsupported target owner type: $TARGET_OWNER_TYPE"
            exit 1
          fi

      - name: Fetch Source Branches
        run: |
          echo "Fetching source branches..."

          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$SOURCE_OWNER/$SOURCE_REPO/branches" \
            --jq '.[].name' > source-branches.txt

          if [ ! -s source-branches.txt ]; then
            echo "ERROR: No branches found in source repository"
            exit 1
          fi

          echo "Branches found:"
          cat source-branches.txt

      - name: Fetch Source Classic Branch Protection Rules
        if: ${{ inputs.copy_branch_protection == 'true' }}
        run: |
          echo "Fetching classic branch protection rules from source repository..."

          mkdir -p branch-protections

          INDEX=0

          while IFS= read -r BRANCH
          do
            INDEX=$((INDEX + 1))
            BRANCH_KEY="branch_$INDEX"

            echo "Checking protection for branch: $BRANCH"

            ENCODED_BRANCH=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$BRANCH")

            if gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$SOURCE_OWNER/$SOURCE_REPO/branches/$ENCODED_BRANCH/protection" \
              > "branch-protections/$BRANCH_KEY.raw.json" 2>/dev/null
            then
              echo "Protection found for branch: $BRANCH"

              printf '%s\n' "$BRANCH" > "branch-protections/$BRANCH_KEY.branch"

              jq '
              {
                required_status_checks:
                (
                  if .required_status_checks == null
                  then null
                  else {
                    strict: (.required_status_checks.strict // false),
                    contexts:
                      (
                        .required_status_checks.contexts
                        //
                        (
                          (.required_status_checks.checks // [])
                          | map(.context // .name // empty)
                        )
                        //
                        []
                      )
                  }
                  end
                ),

                enforce_admins:
                  (.enforce_admins.enabled // false),

                required_pull_request_reviews:
                (
                  if .required_pull_request_reviews == null
                  then null
                  else {
                    dismiss_stale_reviews:
                      (.required_pull_request_reviews.dismiss_stale_reviews // false),
                    require_code_owner_reviews:
                      (.required_pull_request_reviews.require_code_owner_reviews // false),
                    required_approving_review_count:
                      (.required_pull_request_reviews.required_approving_review_count // 0),
                    require_last_push_approval:
                      (.required_pull_request_reviews.require_last_push_approval // false),
                    dismissal_restrictions: {
                      users: ((.required_pull_request_reviews.dismissal_restrictions.users // []) | map(.login)),
                      teams: ((.required_pull_request_reviews.dismissal_restrictions.teams // []) | map(.slug)),
                      apps: ((.required_pull_request_reviews.dismissal_restrictions.apps // []) | map(.slug))
                    },
                    bypass_pull_request_allowances: {
                      users: ((.required_pull_request_reviews.bypass_pull_request_allowances.users // []) | map(.login)),
                      teams: ((.required_pull_request_reviews.bypass_pull_request_allowances.teams // []) | map(.slug)),
                      apps: ((.required_pull_request_reviews.bypass_pull_request_allowances.apps // []) | map(.slug))
                    }
                  }
                  end
                ),

                restrictions:
                (
                  if .restrictions == null
                  then null
                  else {
                    users: ((.restrictions.users // []) | map(.login)),
                    teams: ((.restrictions.teams // []) | map(.slug)),
                    apps: ((.restrictions.apps // []) | map(.slug))
                  }
                  end
                ),

                required_linear_history:
                  (.required_linear_history.enabled // false),

                allow_force_pushes:
                  (.allow_force_pushes.enabled // false),

                allow_deletions:
                  (.allow_deletions.enabled // false),

                block_creations:
                  (.block_creations.enabled // false),

                required_conversation_resolution:
                  (.required_conversation_resolution.enabled // false),

                lock_branch:
                  (.lock_branch.enabled // false),

                allow_fork_syncing:
                  (.allow_fork_syncing.enabled // false)
              }
              ' "branch-protections/$BRANCH_KEY.raw.json" > "branch-protections/$BRANCH_KEY.org.json"

              jq '
              .restrictions = null
              |
              if .required_pull_request_reviews != null
              then
                .required_pull_request_reviews |=
                del(
                  .dismissal_restrictions,
                  .bypass_pull_request_allowances
                )
              else
                .
              end
              ' "branch-protections/$BRANCH_KEY.org.json" > "branch-protections/$BRANCH_KEY.user.json"

            else
              echo "No classic branch protection found for branch: $BRANCH"
            fi
          done < source-branches.txt

          echo "Completed fetching classic branch protection rules"

      - name: Fetch Source Repository Rulesets
        if: ${{ inputs.copy_rulesets == 'true' }}
        run: |
          echo "Fetching repository rulesets from source repository..."

          mkdir -p repo-rulesets

          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$SOURCE_OWNER/$SOURCE_REPO/rulesets?includes_parents=false" \
            > repo-rulesets/rulesets-list.json

          RULESET_COUNT=$(jq 'length' repo-rulesets/rulesets-list.json)

          echo "Repository-level rulesets found: $RULESET_COUNT"

          if [ "$RULESET_COUNT" -eq 0 ]; then
            echo "No repository-level rulesets found in source repository"
            exit 0
          fi

          jq -r '.[].id' repo-rulesets/rulesets-list.json > repo-rulesets/ruleset-ids.txt

          while IFS= read -r RULESET_ID
          do
            echo "Fetching full ruleset details for ID: $RULESET_ID"

            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$SOURCE_OWNER/$SOURCE_REPO/rulesets/$RULESET_ID" \
              > "repo-rulesets/$RULESET_ID.raw.json"

            jq '
            {
              name: .name,
              target: .target,
              enforcement: .enforcement,
              bypass_actors: (.bypass_actors // []),
              conditions: (.conditions // {}),
              rules: (.rules // [])
            }
            ' "repo-rulesets/$RULESET_ID.raw.json" > "repo-rulesets/$RULESET_ID.org.json"

            jq '
            .bypass_actors = []
            ' "repo-rulesets/$RULESET_ID.org.json" > "repo-rulesets/$RULESET_ID.user.json"

          done < repo-rulesets/ruleset-ids.txt

          echo "Completed fetching repository rulesets"

      - name: Create New Repository
        run: |
          echo "Creating target repository: $TARGET_OWNER/$TARGET_REPO"

          if gh repo view "$TARGET_OWNER/$TARGET_REPO" >/dev/null 2>&1
          then
            echo "Repository already exists: $TARGET_OWNER/$TARGET_REPO"
          else
            gh repo create "$TARGET_OWNER/$TARGET_REPO" \
              --${{ inputs.visibility }}

            echo "Repository created: $TARGET_OWNER/$TARGET_REPO"
          fi

      - name: Verify Target Repository Exists
        run: |
          echo "Verifying target repository..."
          gh repo view "$TARGET_OWNER/$TARGET_REPO"
          echo "Target repository verified"

      - name: Mirror Clone Source Repository
        run: |
          echo "Mirror cloning source repository..."

          git clone --mirror \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/$SOURCE_OWNER/$SOURCE_REPO.git" \
            repo-mirror

          echo "Mirror clone completed"

      - name: Push Mirror To Target Repository
        run: |
          echo "Pushing mirror to target repository..."

          cd repo-mirror

          git remote set-url origin \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/$TARGET_OWNER/$TARGET_REPO.git"

          git push --mirror

          echo "Mirror push completed"

      - name: Apply Classic Branch Protection Rules To Target Repository
        if: ${{ inputs.copy_branch_protection == 'true' }}
        run: |
          echo "Applying classic branch protection rules to target repository..."
          echo "Target owner type: $TARGET_OWNER_TYPE"

          if [ ! -d branch-protections ]; then
            echo "No branch protection data found"
            exit 0
          fi

          APPLIED_COUNT=0
          FAILED_COUNT=0
          SKIPPED_COUNT=0

          for BRANCH_FILE in branch-protections/*.branch
          do
            if [ ! -f "$BRANCH_FILE" ]; then
              echo "No branch protection files found"
              exit 0
            fi

            BRANCH_KEY=$(basename "$BRANCH_FILE" .branch)
            BRANCH=$(cat "$BRANCH_FILE")

            if [ -z "$BRANCH" ]; then
              echo "Skipping empty branch file: $BRANCH_FILE"
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              continue
            fi

            if [ "$TARGET_OWNER_TYPE" = "Organization" ]; then
              PAYLOAD_FILE="branch-protections/$BRANCH_KEY.org.json"
            else
              PAYLOAD_FILE="branch-protections/$BRANCH_KEY.user.json"
            fi

            if [ ! -f "$PAYLOAD_FILE" ]; then
              echo "Skipping branch without protection payload: $BRANCH"
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              continue
            fi

            echo "Applying protection to target branch: $BRANCH"

            ENCODED_BRANCH=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$BRANCH")

            if gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "repos/$TARGET_OWNER/$TARGET_REPO/branches/$ENCODED_BRANCH/protection" \
              --input "$PAYLOAD_FILE"
            then
              echo "Applied protection to branch: $BRANCH"
              APPLIED_COUNT=$((APPLIED_COUNT + 1))
            else
              echo "Full protection failed for branch: $BRANCH"
              echo "Retrying with personal-safe payload..."

              SAFE_FILE="branch-protections/$BRANCH_KEY.personal-safe.json"

              jq '
              .restrictions = null
              |
              if .required_pull_request_reviews != null
              then
                .required_pull_request_reviews |=
                del(
                  .dismissal_restrictions,
                  .bypass_pull_request_allowances
                )
              else
                .
              end
              ' "branch-protections/$BRANCH_KEY.org.json" > "$SAFE_FILE"

              if gh api \
                --method PUT \
                -H "Accept: application/vnd.github+json" \
                "repos/$TARGET_OWNER/$TARGET_REPO/branches/$ENCODED_BRANCH/protection" \
                --input "$SAFE_FILE"
              then
                echo "Applied personal-safe protection to branch: $BRANCH"
                APPLIED_COUNT=$((APPLIED_COUNT + 1))
              else
                echo "Personal-safe protection failed for branch: $BRANCH"
                echo "Retrying without required status checks..."

                SAFE_NO_CHECKS_FILE="branch-protections/$BRANCH_KEY.personal-safe-no-checks.json"

                jq '
                .restrictions = null
                |
                .required_status_checks = null
                |
                if .required_pull_request_reviews != null
                then
                  .required_pull_request_reviews |=
                  del(
                    .dismissal_restrictions,
                    .bypass_pull_request_allowances
                  )
                else
                  .
                end
                ' "branch-protections/$BRANCH_KEY.org.json" > "$SAFE_NO_CHECKS_FILE"

                if gh api \
                  --method PUT \
                  -H "Accept: application/vnd.github+json" \
                  "repos/$TARGET_OWNER/$TARGET_REPO/branches/$ENCODED_BRANCH/protection" \
                  --input "$SAFE_NO_CHECKS_FILE"
                then
                  echo "Applied protection without status checks to branch: $BRANCH"
                  APPLIED_COUNT=$((APPLIED_COUNT + 1))
                else
                  echo "Protection failed for branch: $BRANCH"
                  FAILED_COUNT=$((FAILED_COUNT + 1))
                fi
              fi
            fi
          done

          echo "Classic branch protection apply summary"
          echo "Applied: $APPLIED_COUNT"
          echo "Skipped: $SKIPPED_COUNT"
          echo "Failed: $FAILED_COUNT"

          if [ "$FAILED_COUNT" -gt 0 ]; then
            echo "WARNING: Some branch protection rules failed to apply"
          fi

      - name: Apply Repository Rulesets To Target Repository
        if: ${{ inputs.copy_rulesets == 'true' }}
        run: |
          echo "Applying repository rulesets to target repository..."
          echo "Target owner type: $TARGET_OWNER_TYPE"

          if [ ! -f repo-rulesets/ruleset-ids.txt ]; then
            echo "No repository-level rulesets found to apply"
            exit 0
          fi

          APPLIED_RULESETS=0
          FAILED_RULESETS=0

          while IFS= read -r RULESET_ID
          do
            if [ "$TARGET_OWNER_TYPE" = "Organization" ]; then
              CLEAN_FILE="repo-rulesets/$RULESET_ID.org.json"
            else
              CLEAN_FILE="repo-rulesets/$RULESET_ID.user.json"
            fi

            if [ ! -f "$CLEAN_FILE" ]; then
              echo "Ruleset file missing for ID: $RULESET_ID"
              FAILED_RULESETS=$((FAILED_RULESETS + 1))
              continue
            fi

            RULESET_NAME=$(jq -r '.name // "unknown-ruleset"' "$CLEAN_FILE")

            echo "Creating ruleset in target repository: $RULESET_NAME"

            if gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/$TARGET_OWNER/$TARGET_REPO/rulesets" \
              --input "$CLEAN_FILE"
            then
              echo "Created ruleset: $RULESET_NAME"
              APPLIED_RULESETS=$((APPLIED_RULESETS + 1))
            else
              echo "Ruleset creation failed for: $RULESET_NAME"
              echo "Retrying without bypass actors..."

              RETRY_FILE="repo-rulesets/$RULESET_ID.retry-no-bypass.json"

              jq '
              .bypass_actors = []
              ' "$CLEAN_FILE" > "$RETRY_FILE"

              if gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                "repos/$TARGET_OWNER/$TARGET_REPO/rulesets" \
                --input "$RETRY_FILE"
              then
                echo "Created ruleset without bypass actors: $RULESET_NAME"
                APPLIED_RULESETS=$((APPLIED_RULESETS + 1))
              else
                echo "Ruleset still failed: $RULESET_NAME"
                FAILED_RULESETS=$((FAILED_RULESETS + 1))
              fi
            fi

          done < repo-rulesets/ruleset-ids.txt

          echo "Ruleset apply summary"
          echo "Applied: $APPLIED_RULESETS"
          echo "Failed: $FAILED_RULESETS"

          if [ "$FAILED_RULESETS" -gt 0 ]; then
            echo "WARNING: Some rulesets failed to apply"
          fi

      - name: Setup CODEOWNERS
        if: ${{ inputs.team_slug != '' }}
        run: |
          echo "Setting up CODEOWNERS..."

          if [ "$TARGET_OWNER_TYPE" != "Organization" ]; then
            echo "Skipping CODEOWNERS team entry because target owner is personal user"
            exit 0
          fi

          git clone \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/$TARGET_OWNER/$TARGET_REPO.git" \
            codeowners-repo

          cd codeowners-repo

          mkdir -p .github

          echo "* @$TARGET_OWNER/${{ inputs.team_slug }}" > .github/CODEOWNERS

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          git add .github/CODEOWNERS

          git commit -m "chore: add CODEOWNERS file" || echo "Nothing to commit"

          git push

          echo "CODEOWNERS setup completed"

      - name: Verify Applied Classic Branch Protections
        if: ${{ inputs.copy_branch_protection == 'true' }}
        run: |
          echo "Verifying applied classic branch protections..."

          if [ ! -d branch-protections ]; then
            echo "No branch protection data found"
            exit 0
          fi

          for BRANCH_FILE in branch-protections/*.branch
          do
            if [ ! -f "$BRANCH_FILE" ]; then
              echo "No branch protection files found"
              exit 0
            fi

            BRANCH=$(cat "$BRANCH_FILE")
            ENCODED_BRANCH=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$BRANCH")

            echo "Checking target protection for branch: $BRANCH"

            if gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$TARGET_OWNER/$TARGET_REPO/branches/$ENCODED_BRANCH/protection" >/dev/null 2>&1
            then
              echo "Verified protection exists for branch: $BRANCH"
            else
              echo "Protection not found for branch: $BRANCH"
            fi
          done

      - name: Final Summary
        run: |
          echo "Repository clone workflow completed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Source Repository:"
          echo "https://github.com/$SOURCE_OWNER/$SOURCE_REPO"
          echo ""
          echo "Target Repository:"
          echo "https://github.com/$TARGET_OWNER/$TARGET_REPO"
          echo ""
          echo "Target Owner Type:"
          echo "$TARGET_OWNER_TYPE"
          echo ""
          echo "Visibility:"
          echo "${{ inputs.visibility }}"
          echo ""
          echo "Classic Branch Protection Copy:"
          echo "${{ inputs.copy_branch_protection }}"
          echo ""
          echo "Repository Ruleset Copy:"
          echo "${{ inputs.copy_rulesets }}"
          echo ""
          echo "CODEOWNERS Team:"
          echo "${{ inputs.team_slug }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
