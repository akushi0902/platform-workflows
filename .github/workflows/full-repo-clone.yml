name: Full Repository Clone - Files, Branches, Rulesets and Branch Protection

permissions:
  contents: write
  actions: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      new_repo_name:
        description: "New repository name"
        required: true
        type: string

      source_repo_url:
        description: "Source repository URL"
        required: true
        type: string

      target_profile_url:
        description: "Target GitHub user/org profile URL"
        required: true
        type: string

      target_pat:
        description: "Target GitHub user/org PAT"
        required: true
        type: string

      visibility:
        description: "Target repository visibility"
        required: false
        default: "private"
        type: choice
        options:
          - private
          - public

      team_slug:
        description: "Team slug optional, only for org repos CODEOWNERS"
        required: false
        default: ""
        type: string

      setup_codeowners:
        description: "Create CODEOWNERS file for org team"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      copy_branch_protection:
        description: "Copy classic branch protection rules"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      copy_rulesets:
        description: "Copy repository rulesets"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  clone-repo:
    runs-on: ubuntu-latest

    env:
      SOURCE_PAT: ${{ secrets.GH_PAT }}
      TARGET_PAT: ${{ inputs.target_pat }}

    steps:
      - name: Mask Tokens
        run: |
          echo "::add-mask::${SOURCE_PAT}"
          echo "::add-mask::${TARGET_PAT}"
          echo "Tokens masked"

      - name: Install Dependencies
        run: |
          echo "Installing dependencies..."
          sudo apt-get update
          sudo apt-get install -y jq

          gh --version
          git --version
          jq --version

      - name: Validate Inputs And Tokens
        run: |
          if [ -z "${{ inputs.new_repo_name }}" ]; then
            echo "ERROR: new_repo_name is required"
            exit 1
          fi

          if [ -z "${{ inputs.source_repo_url }}" ]; then
            echo "ERROR: source_repo_url is required"
            exit 1
          fi

          if [ -z "${{ inputs.target_profile_url }}" ]; then
            echo "ERROR: target_profile_url is required"
            exit 1
          fi

          if [ -z "$SOURCE_PAT" ]; then
            echo "ERROR: GH_PAT repository secret is missing"
            exit 1
          fi

          if [ -z "$TARGET_PAT" ]; then
            echo "ERROR: target_pat input is required"
            exit 1
          fi

          echo "Inputs and tokens validated"

      - name: Prepare Repository Variables
        run: |
          echo "Preparing repository variables..."

          SOURCE_URL="${{ inputs.source_repo_url }}"
          SOURCE_URL="${SOURCE_URL%.git}"
          SOURCE_URL="${SOURCE_URL%/}"

          if echo "$SOURCE_URL" | grep -q "^https://github.com/"; then
            SOURCE_PATH="${SOURCE_URL#https://github.com/}"
          else
            echo "ERROR: source_repo_url must be like https://github.com/source-owner/source-repo"
            exit 1
          fi

          SOURCE_OWNER="$(echo "$SOURCE_PATH" | cut -d '/' -f1)"
          SOURCE_REPO="$(echo "$SOURCE_PATH" | cut -d '/' -f2)"

          if [ -z "$SOURCE_OWNER" ] || [ -z "$SOURCE_REPO" ]; then
            echo "ERROR: Could not parse source owner/repo"
            exit 1
          fi

          TARGET_PROFILE_URL="${{ inputs.target_profile_url }}"
          TARGET_PROFILE_URL="${TARGET_PROFILE_URL%.git}"
          TARGET_PROFILE_URL="${TARGET_PROFILE_URL%/}"

          if echo "$TARGET_PROFILE_URL" | grep -q "^https://github.com/"; then
            TARGET_PATH="${TARGET_PROFILE_URL#https://github.com/}"
          else
            echo "ERROR: target_profile_url must be like https://github.com/target-user-or-org"
            exit 1
          fi

          TARGET_ACCOUNT="$(echo "$TARGET_PATH" | cut -d '/' -f1)"
          TARGET_REPO="${{ inputs.new_repo_name }}"

          if [ -z "$TARGET_ACCOUNT" ]; then
            echo "ERROR: Could not parse target user/org from target_profile_url"
            exit 1
          fi

          if [ -z "$TARGET_REPO" ]; then
            echo "ERROR: Target repository name is empty"
            exit 1
          fi

          echo "SOURCE_URL=$SOURCE_URL" >> "$GITHUB_ENV"
          echo "SOURCE_OWNER=$SOURCE_OWNER" >> "$GITHUB_ENV"
          echo "SOURCE_REPO=$SOURCE_REPO" >> "$GITHUB_ENV"
          echo "TARGET_PROFILE_URL=$TARGET_PROFILE_URL" >> "$GITHUB_ENV"
          echo "TARGET_ACCOUNT=$TARGET_ACCOUNT" >> "$GITHUB_ENV"
          echo "TARGET_REPO=$TARGET_REPO" >> "$GITHUB_ENV"

          echo "Source owner: $SOURCE_OWNER"
          echo "Source repo: $SOURCE_REPO"
          echo "Target profile URL: $TARGET_PROFILE_URL"
          echo "Target account: $TARGET_ACCOUNT"
          echo "Target repo: $TARGET_REPO"

      - name: Authenticate Source Token
        env:
          GH_TOKEN: ${{ env.SOURCE_PAT }}
        run: |
          echo "Validating source token..."

          SOURCE_AUTH_LOGIN="$(gh api user --jq '.login')"

          if [ -z "$SOURCE_AUTH_LOGIN" ]; then
            echo "ERROR: Unable to authenticate using GH_PAT"
            exit 1
          fi

          echo "SOURCE_AUTH_LOGIN=$SOURCE_AUTH_LOGIN" >> "$GITHUB_ENV"
          echo "Source token authenticated as: $SOURCE_AUTH_LOGIN"

      - name: Authenticate Target Token
        env:
          GH_TOKEN: ${{ env.TARGET_PAT }}
        run: |
          echo "Validating target token..."

          TARGET_AUTH_LOGIN="$(gh api user --jq '.login')"

          if [ -z "$TARGET_AUTH_LOGIN" ]; then
            echo "ERROR: Unable to authenticate using target_pat"
            exit 1
          fi

          echo "TARGET_AUTH_LOGIN=$TARGET_AUTH_LOGIN" >> "$GITHUB_ENV"
          echo "Target token authenticated as: $TARGET_AUTH_LOGIN"

      - name: Detect Source And Target Account Type
        run: |
          echo "Detecting source account type..."

          SOURCE_ACCOUNT_TYPE="$(GH_TOKEN="$SOURCE_PAT" gh api \
            -H "Accept: application/vnd.github+json" \
            "users/$SOURCE_OWNER" \
            --jq '.type')"

          if [ -z "$SOURCE_ACCOUNT_TYPE" ]; then
            echo "ERROR: Could not detect source account type"
            exit 1
          fi

          echo "SOURCE_ACCOUNT_TYPE=$SOURCE_ACCOUNT_TYPE" >> "$GITHUB_ENV"
          echo "Source account type: $SOURCE_ACCOUNT_TYPE"

          echo "Detecting target account type..."

          TARGET_ACCOUNT_TYPE="$(GH_TOKEN="$TARGET_PAT" gh api \
            -H "Accept: application/vnd.github+json" \
            "users/$TARGET_ACCOUNT" \
            --jq '.type')"

          if [ "$TARGET_ACCOUNT_TYPE" = "Organization" ]; then
            echo "Target account is an Organization"
            echo "TARGET_ACCOUNT_TYPE=Organization" >> "$GITHUB_ENV"
          elif [ "$TARGET_ACCOUNT_TYPE" = "User" ]; then
            echo "Target account is a Personal User"
            echo "TARGET_ACCOUNT_TYPE=User" >> "$GITHUB_ENV"
          else
            echo "ERROR: Unsupported target account type: $TARGET_ACCOUNT_TYPE"
            exit 1
          fi

      - name: Validate Target Personal Account Permission
        run: |
          echo "Validating target account permissions..."

          if [ "$TARGET_ACCOUNT_TYPE" = "User" ]; then
            if [ "$TARGET_AUTH_LOGIN" != "$TARGET_ACCOUNT" ]; then
              echo "ERROR: Target is a personal GitHub user: $TARGET_ACCOUNT"
              echo "ERROR: Provided target PAT belongs to: $TARGET_AUTH_LOGIN"
              echo "ERROR: For personal user repositories, target PAT must belong to the same target user."
              exit 1
            fi

            echo "Personal target account validated"
          else
            echo "Target is organization."
            echo "Provided target PAT user must have repo creation and admin permissions in this organization."
          fi

      - name: Fetch Source Repository Metadata
        env:
          GH_TOKEN: ${{ env.SOURCE_PAT }}
        run: |
          echo "Fetching source repository metadata..."

          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$SOURCE_OWNER/$SOURCE_REPO" \
            > source-repo.json

          SOURCE_DEFAULT_BRANCH="$(jq -r '.default_branch // empty' source-repo.json)"

          if [ -z "$SOURCE_DEFAULT_BRANCH" ]; then
            echo "ERROR: Could not detect source default branch"
            exit 1
          fi

          echo "SOURCE_DEFAULT_BRANCH=$SOURCE_DEFAULT_BRANCH" >> "$GITHUB_ENV"
          echo "Source default branch: $SOURCE_DEFAULT_BRANCH"

      - name: Fetch Source Branches
        env:
          GH_TOKEN: ${{ env.SOURCE_PAT }}
        run: |
          echo "Fetching source branches..."

          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/$SOURCE_OWNER/$SOURCE_REPO/branches?per_page=100" \
            --jq '.[].name' \
            > source-branches.txt

          if [ ! -s source-branches.txt ]; then
            echo "ERROR: No branches found in source repository"
            exit 1
          fi

          echo "Branches found:"
          cat source-branches.txt

      - name: Fetch Source Classic Branch Protection Rules
        if: ${{ inputs.copy_branch_protection == 'true' }}
        env:
          GH_TOKEN: ${{ env.SOURCE_PAT }}
        run: |
          echo "Fetching classic branch protection rules from source repository..."

          mkdir -p branch-protections

          INDEX=0

          while IFS= read -r BRANCH
          do
            INDEX=$((INDEX + 1))
            BRANCH_KEY="branch_$INDEX"

            echo "Checking protection for branch: $BRANCH"

            ENCODED_BRANCH="$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$BRANCH")"

            if gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$SOURCE_OWNER/$SOURCE_REPO/branches/$ENCODED_BRANCH/protection" \
              > "branch-protections/$BRANCH_KEY.raw.json" 2>/dev/null
            then
              echo "Protection found for branch: $BRANCH"

              printf '%s\n' "$BRANCH" > "branch-protections/$BRANCH_KEY.branch"

              jq '
              {
                required_status_checks:
                (
                  if .required_status_checks == null
                  then null
                  else {
                    strict: (.required_status_checks.strict // false),
                    contexts:
                    (
                      .required_status_checks.contexts
                      //
                      (
                        (.required_status_checks.checks // [])
                        | map(.context // .name // empty)
                      )
                      //
                      []
                    )
                  }
                  end
                ),

                enforce_admins:
                  (.enforce_admins.enabled // false),

                required_pull_request_reviews:
                (
                  if .required_pull_request_reviews == null
                  then null
                  else {
                    dismiss_stale_reviews:
                      (.required_pull_request_reviews.dismiss_stale_reviews // false),
                    require_code_owner_reviews:
                      (.required_pull_request_reviews.require_code_owner_reviews // false),
                    required_approving_review_count:
                      (.required_pull_request_reviews.required_approving_review_count // 0),
                    require_last_push_approval:
                      (.required_pull_request_reviews.require_last_push_approval // false),
                    dismissal_restrictions: {
                      users: ((.required_pull_request_reviews.dismissal_restrictions.users // []) | map(.login)),
                      teams: ((.required_pull_request_reviews.dismissal_restrictions.teams // []) | map(.slug)),
                      apps: ((.required_pull_request_reviews.dismissal_restrictions.apps // []) | map(.slug))
                    },
                    bypass_pull_request_allowances: {
                      users: ((.required_pull_request_reviews.bypass_pull_request_allowances.users // []) | map(.login)),
                      teams: ((.required_pull_request_reviews.bypass_pull_request_allowances.teams // []) | map(.slug)),
                      apps: ((.required_pull_request_reviews.bypass_pull_request_allowances.apps // []) | map(.slug))
                    }
                  }
                  end
                ),

                restrictions:
                (
                  if .restrictions == null
                  then null
                  else {
                    users: ((.restrictions.users // []) | map(.login)),
                    teams: ((.restrictions.teams // []) | map(.slug)),
                    apps: ((.restrictions.apps // []) | map(.slug))
                  }
                  end
                ),

                required_linear_history:
                  (.required_linear_history.enabled // false),

                allow_force_pushes:
                  (.allow_force_pushes.enabled // false),

                allow_deletions:
                  (.allow_deletions.enabled // false),

                block_creations:
                  (.block_creations.enabled // false),

                required_conversation_resolution:
                  (.required_conversation_resolution.enabled // false),

                lock_branch:
                  (.lock_branch.enabled // false),

                allow_fork_syncing:
                  (.allow_fork_syncing.enabled // false)
              }
              ' "branch-protections/$BRANCH_KEY.raw.json" \
              > "branch-protections/$BRANCH_KEY.org.json"

              jq '
              .restrictions = null
              |
              if .required_pull_request_reviews != null
              then
                .required_pull_request_reviews |=
                del(
                  .dismissal_restrictions,
                  .bypass_pull_request_allowances
                )
              else
                .
              end
              ' "branch-protections/$BRANCH_KEY.org.json" \
              > "branch-protections/$BRANCH_KEY.user.json"

            else
              echo "No classic branch protection found for branch: $BRANCH"
            fi
          done < source-branches.txt

          echo "Completed fetching classic branch protection rules"

      - name: Fetch Source Repository Rulesets
        if: ${{ inputs.copy_rulesets == 'true' }}
        env:
          GH_TOKEN: ${{ env.SOURCE_PAT }}
        run: |
          echo "Fetching repository rulesets from source repository..."

          mkdir -p repo-rulesets

          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$SOURCE_OWNER/$SOURCE_REPO/rulesets?includes_parents=false" \
            > repo-rulesets/rulesets-list.json

          RULESET_COUNT="$(jq 'length' repo-rulesets/rulesets-list.json)"

          echo "Repository-level rulesets found: $RULESET_COUNT"

          if [ "$RULESET_COUNT" -eq 0 ]; then
            echo "No repository-level rulesets found in source repository"
            exit 0
          fi

          jq -r '.[].id' repo-rulesets/rulesets-list.json \
            > repo-rulesets/ruleset-ids.txt

          while IFS= read -r RULESET_ID
          do
            echo "Fetching full ruleset details for ID: $RULESET_ID"

            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$SOURCE_OWNER/$SOURCE_REPO/rulesets/$RULESET_ID" \
              > "repo-rulesets/$RULESET_ID.raw.json"

            jq '
            {
              name: .name,
              target: .target,
              enforcement: .enforcement,
              bypass_actors: (.bypass_actors // []),
              conditions: (.conditions // {}),
              rules: (.rules // [])
            }
            ' "repo-rulesets/$RULESET_ID.raw.json" \
            > "repo-rulesets/$RULESET_ID.org.json"

            jq '
            .bypass_actors = []
            ' "repo-rulesets/$RULESET_ID.org.json" \
            > "repo-rulesets/$RULESET_ID.user.json"

          done < repo-rulesets/ruleset-ids.txt

          echo "Completed fetching repository rulesets"

      - name: Create Target Repository
        env:
          GH_TOKEN: ${{ env.TARGET_PAT }}
        run: |
          echo "Creating target repository: $TARGET_ACCOUNT/$TARGET_REPO"

          if gh repo view "$TARGET_ACCOUNT/$TARGET_REPO" >/dev/null 2>&1
          then
            echo "Repository already exists: $TARGET_ACCOUNT/$TARGET_REPO"
            exit 0
          fi

          if [ "${{ inputs.visibility }}" = "private" ]; then
            PRIVATE_FLAG=true
          else
            PRIVATE_FLAG=false
          fi

          if [ "$TARGET_ACCOUNT_TYPE" = "Organization" ]; then
            echo "Creating repository under organization: $TARGET_ACCOUNT"

            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "orgs/$TARGET_ACCOUNT/repos" \
              -f name="$TARGET_REPO" \
              -F private="$PRIVATE_FLAG"

          else
            echo "Creating repository under personal user account: $TARGET_ACCOUNT"

            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "user/repos" \
              -f name="$TARGET_REPO" \
              -F private="$PRIVATE_FLAG"
          fi

          echo "Repository created: $TARGET_ACCOUNT/$TARGET_REPO"

      - name: Verify Target Repository Exists
        env:
          GH_TOKEN: ${{ env.TARGET_PAT }}
        run: |
          echo "Verifying target repository..."

          gh repo view "$TARGET_ACCOUNT/$TARGET_REPO"

          echo "Target repository verified"

      - name: Clone Source Repository As Bare Repo
        run: |
          echo "Cloning source repository with all branches and tags..."

          git clone --bare \
            "https://x-access-token:${SOURCE_PAT}@github.com/$SOURCE_OWNER/$SOURCE_REPO.git" \
            repo-bare.git

          echo "Bare clone completed"

      - name: Push All Branches And Tags To Target Repository
        run: |
          echo "Pushing all branches and tags to target repository..."

          cd repo-bare.git

          git remote add target \
            "https://x-access-token:${TARGET_PAT}@github.com/$TARGET_ACCOUNT/$TARGET_REPO.git"

          echo "Pushing all branches..."
          git push target '+refs/heads/*:refs/heads/*'

          echo "Pushing all tags..."
          git push target '+refs/tags/*:refs/tags/*' || true

          echo "Branches and tags pushed successfully"

      - name: Set Target Default Branch
        env:
          GH_TOKEN: ${{ env.TARGET_PAT }}
        run: |
          echo "Setting target default branch to source default branch: $SOURCE_DEFAULT_BRANCH"

          if gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/$TARGET_ACCOUNT/$TARGET_REPO" \
            -f default_branch="$SOURCE_DEFAULT_BRANCH"
          then
            echo "Target default branch updated: $SOURCE_DEFAULT_BRANCH"
          else
            echo "WARNING: Could not set target default branch to $SOURCE_DEFAULT_BRANCH"
          fi

      - name: Setup CODEOWNERS
        if: ${{ inputs.setup_codeowners == 'true' && inputs.team_slug != '' }}
        run: |
          echo "Setting up CODEOWNERS..."

          if [ "$TARGET_ACCOUNT_TYPE" != "Organization" ]; then
            echo "Skipping CODEOWNERS because target account is a personal user"
            exit 0
          fi

          git clone \
            "https://x-access-token:${TARGET_PAT}@github.com/$TARGET_ACCOUNT/$TARGET_REPO.git" \
            codeowners-repo

          cd codeowners-repo

          git checkout "$SOURCE_DEFAULT_BRANCH"

          mkdir -p .github

          echo "* @$TARGET_ACCOUNT/${{ inputs.team_slug }}" > .github/CODEOWNERS

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          git add .github/CODEOWNERS

          git commit -m "chore: add CODEOWNERS file" || echo "Nothing to commit"

          git push origin "$SOURCE_DEFAULT_BRANCH"

          echo "CODEOWNERS setup completed"

      - name: Apply Classic Branch Protection Rules To Target Repository
        if: ${{ inputs.copy_branch_protection == 'true' }}
        env:
          GH_TOKEN: ${{ env.TARGET_PAT }}
        run: |
          echo "Applying classic branch protection rules to target repository..."
          echo "Target account type: $TARGET_ACCOUNT_TYPE"

          if [ ! -d branch-protections ]; then
            echo "No branch protection data found"
            exit 0
          fi

          APPLIED_COUNT=0
          FAILED_COUNT=0
          SKIPPED_COUNT=0

          for BRANCH_FILE in branch-protections/*.branch
          do
            if [ ! -f "$BRANCH_FILE" ]; then
              echo "No branch protection files found"
              exit 0
            fi

            BRANCH_KEY="$(basename "$BRANCH_FILE" .branch)"
            BRANCH="$(cat "$BRANCH_FILE")"

            if [ -z "$BRANCH" ]; then
              echo "Skipping empty branch file: $BRANCH_FILE"
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              continue
            fi

            if [ "$TARGET_ACCOUNT_TYPE" = "Organization" ]; then
              PAYLOAD_FILE="branch-protections/$BRANCH_KEY.org.json"
            else
              PAYLOAD_FILE="branch-protections/$BRANCH_KEY.user.json"
            fi

            if [ ! -f "$PAYLOAD_FILE" ]; then
              echo "Skipping branch without protection payload: $BRANCH"
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              continue
            fi

            echo "Applying protection to target branch: $BRANCH"

            ENCODED_BRANCH="$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$BRANCH")"

            if gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "repos/$TARGET_ACCOUNT/$TARGET_REPO/branches/$ENCODED_BRANCH/protection" \
              --input "$PAYLOAD_FILE"
            then
              echo "Applied protection to branch: $BRANCH"
              APPLIED_COUNT=$((APPLIED_COUNT + 1))
            else
              echo "Full protection failed for branch: $BRANCH"
              echo "Retrying with safe payload..."

              SAFE_FILE="branch-protections/$BRANCH_KEY.safe.json"

              jq '
              .restrictions = null
              |
              if .required_pull_request_reviews != null
              then
                .required_pull_request_reviews |=
                del(
                  .dismissal_restrictions,
                  .bypass_pull_request_allowances
                )
              else
                .
              end
              ' "branch-protections/$BRANCH_KEY.org.json" \
              > "$SAFE_FILE"

              if gh api \
                --method PUT \
                -H "Accept: application/vnd.github+json" \
                "repos/$TARGET_ACCOUNT/$TARGET_REPO/branches/$ENCODED_BRANCH/protection" \
                --input "$SAFE_FILE"
              then
                echo "Applied safe protection to branch: $BRANCH"
                APPLIED_COUNT=$((APPLIED_COUNT + 1))
              else
                echo "Safe protection failed for branch: $BRANCH"
                echo "Retrying without required status checks..."

                SAFE_NO_CHECKS_FILE="branch-protections/$BRANCH_KEY.safe-no-checks.json"

                jq '
                .restrictions = null
                |
                .required_status_checks = null
                |
                if .required_pull_request_reviews != null
                then
                  .required_pull_request_reviews |=
                  del(
                    .dismissal_restrictions,
                    .bypass_pull_request_allowances
                  )
                else
                  .
                end
                ' "branch-protections/$BRANCH_KEY.org.json" \
                > "$SAFE_NO_CHECKS_FILE"

                if gh api \
                  --method PUT \
                  -H "Accept: application/vnd.github+json" \
                  "repos/$TARGET_ACCOUNT/$TARGET_REPO/branches/$ENCODED_BRANCH/protection" \
                  --input "$SAFE_NO_CHECKS_FILE"
                then
                  echo "Applied protection without status checks to branch: $BRANCH"
                  APPLIED_COUNT=$((APPLIED_COUNT + 1))
                else
                  echo "Protection failed for branch: $BRANCH"
                  FAILED_COUNT=$((FAILED_COUNT + 1))
                fi
              fi
            fi
          done

          echo "Classic branch protection apply summary"
          echo "Applied: $APPLIED_COUNT"
          echo "Skipped: $SKIPPED_COUNT"
          echo "Failed: $FAILED_COUNT"

          if [ "$FAILED_COUNT" -gt 0 ]; then
            echo "WARNING: Some branch protection rules failed to apply"
          fi

      - name: Apply Repository Rulesets To Target Repository
        if: ${{ inputs.copy_rulesets == 'true' }}
        env:
          GH_TOKEN: ${{ env.TARGET_PAT }}
        run: |
          echo "Applying repository rulesets to target repository..."
          echo "Target account type: $TARGET_ACCOUNT_TYPE"

          if [ ! -f repo-rulesets/ruleset-ids.txt ]; then
            echo "No repository-level rulesets found to apply"
            exit 0
          fi

          APPLIED_RULESETS=0
          FAILED_RULESETS=0

          while IFS= read -r RULESET_ID
          do
            if [ "$TARGET_ACCOUNT_TYPE" = "Organization" ]; then
              CLEAN_FILE="repo-rulesets/$RULESET_ID.org.json"
            else
              CLEAN_FILE="repo-rulesets/$RULESET_ID.user.json"
            fi

            if [ ! -f "$CLEAN_FILE" ]; then
              echo "Ruleset file missing for ID: $RULESET_ID"
              FAILED_RULESETS=$((FAILED_RULESETS + 1))
              continue
            fi

            RULESET_NAME="$(jq -r '.name // "unknown-ruleset"' "$CLEAN_FILE")"

            echo "Creating ruleset in target repository: $RULESET_NAME"

            if gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/$TARGET_ACCOUNT/$TARGET_REPO/rulesets" \
              --input "$CLEAN_FILE"
            then
              echo "Created ruleset: $RULESET_NAME"
              APPLIED_RULESETS=$((APPLIED_RULESETS + 1))
            else
              echo "Ruleset creation failed for: $RULESET_NAME"
              echo "Retrying without bypass actors..."

              RETRY_FILE="repo-rulesets/$RULESET_ID.retry-no-bypass.json"

              jq '.bypass_actors = []' "$CLEAN_FILE" > "$RETRY_FILE"

              if gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                "repos/$TARGET_ACCOUNT/$TARGET_REPO/rulesets" \
                --input "$RETRY_FILE"
              then
                echo "Created ruleset without bypass actors: $RULESET_NAME"
                APPLIED_RULESETS=$((APPLIED_RULESETS + 1))
              else
                echo "Ruleset still failed: $RULESET_NAME"
                FAILED_RULESETS=$((FAILED_RULESETS + 1))
              fi
            fi

          done < repo-rulesets/ruleset-ids.txt

          echo "Ruleset apply summary"
          echo "Applied: $APPLIED_RULESETS"
          echo "Failed: $FAILED_RULESETS"

          if [ "$FAILED_RULESETS" -gt 0 ]; then
            echo "WARNING: Some repository rulesets failed to apply"
          fi

      - name: Verify Applied Classic Branch Protections
        if: ${{ inputs.copy_branch_protection == 'true' }}
        env:
          GH_TOKEN: ${{ env.TARGET_PAT }}
        run: |
          echo "Verifying applied classic branch protections..."

          if [ ! -d branch-protections ]; then
            echo "No branch protection data found"
            exit 0
          fi

          for BRANCH_FILE in branch-protections/*.branch
          do
            if [ ! -f "$BRANCH_FILE" ]; then
              echo "No branch protection files found"
              exit 0
            fi

            BRANCH="$(cat "$BRANCH_FILE")"
            ENCODED_BRANCH="$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$BRANCH")"

            echo "Checking target protection for branch: $BRANCH"

            if gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$TARGET_ACCOUNT/$TARGET_REPO/branches/$ENCODED_BRANCH/protection" >/dev/null 2>&1
            then
              echo "Verified protection exists for branch: $BRANCH"
            else
              echo "Protection not found for branch: $BRANCH"
            fi
          done

      - name: Verify Applied Repository Rulesets
        if: ${{ inputs.copy_rulesets == 'true' }}
        env:
          GH_TOKEN: ${{ env.TARGET_PAT }}
        run: |
          echo "Verifying repository rulesets on target repository..."

          if gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$TARGET_ACCOUNT/$TARGET_REPO/rulesets?includes_parents=false" \
            > target-rulesets.json
          then
            TARGET_RULESET_COUNT="$(jq 'length' target-rulesets.json)"
            echo "Target repository rulesets found: $TARGET_RULESET_COUNT"
            jq -r '.[].name' target-rulesets.json || true
          else
            echo "WARNING: Could not verify target repository rulesets"
          fi

      - name: Final Summary
        run: |
          echo "Repository clone workflow completed"
          echo "----------------------------------------"
          echo "Source Repository:"
          echo "https://github.com/$SOURCE_OWNER/$SOURCE_REPO"
          echo ""
          echo "Source Default Branch:"
          echo "$SOURCE_DEFAULT_BRANCH"
          echo ""
          echo "Target Profile URL:"
          echo "$TARGET_PROFILE_URL"
          echo ""
          echo "Target Repository:"
          echo "https://github.com/$TARGET_ACCOUNT/$TARGET_REPO"
          echo ""
          echo "Target Account Type:"
          echo "$TARGET_ACCOUNT_TYPE"
          echo ""
          echo "Source Token User:"
          echo "$SOURCE_AUTH_LOGIN"
          echo ""
          echo "Target Token User:"
          echo "$TARGET_AUTH_LOGIN"
          echo ""
          echo "Visibility:"
          echo "${{ inputs.visibility }}"
          echo ""
          echo "Classic Branch Protection Copy:"
          echo "${{ inputs.copy_branch_protection }}"
          echo ""
          echo "Repository Ruleset Copy:"
          echo "${{ inputs.copy_rulesets }}"
          echo ""
          echo "CODEOWNERS Setup:"
          echo "${{ inputs.setup_codeowners }}"
          echo ""
          echo "CODEOWNERS Team:"
          echo "${{ inputs.team_slug }}"
          echo "----------------------------------------"
